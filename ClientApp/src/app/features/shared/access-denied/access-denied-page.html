<section class="access-page">
  <article class="access-card">
    <div
      class="access-icon"
      aria-hidden="true"
    >
      !
    </div>

    <p class="eyebrow">
      Restricted area
    </p>

    <h1>Access denied</h1>

    <p class="description">
      Your account does not have permission to perform this operation.
    </p>

    @if (currentUser()?.role) {
      <div class="role-information">
        <span>Current role</span>
        <strong>{{ currentUser()?.role }}</strong>
      </div>
    }

    <p class="help-text">
      Viewer accounts can view records but cannot create, edit,
      delete or manage operational data.
    </p>

    <div class="actions">
      <a
        class="primary-button"
        routerLink="/dashboard"
      >
        Return to dashboard
      </a>

      <a
        class="secondary-button"
        routerLink="/materials"
      >
        View materials
      </a>
    </div>
  </article>
</section>
